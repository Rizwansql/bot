<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALA BAZAR | Best Deals</title>
    <style>
        :root { --dark: #121212; --gold: #f39c12; --red: #e74c3c; --green: #27ae60; --white: #fff; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f7f6; }

        header { 
            background: var(--dark); color: var(--white); padding: 12px 5%; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--gold); }
        .menu-icon { font-size: 1.8rem; cursor: pointer; color: var(--white); }

        .sidebar {
            height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; right: 0;
            background-color: var(--dark); overflow-x: hidden; transition: 0.5s; padding-top: 60px;
        }
        .sidebar a { padding: 15px 32px; text-decoration: none; font-size: 1.2rem; color: #818181; display: block; transition: 0.3s; }
        .sidebar a:hover { color: var(--gold); }
        .sidebar .closebtn { position: absolute; top: 10px; right: 25px; font-size: 36px; }

        .nav-tabs { background: white; display: flex; overflow-x: auto; padding: 10px 5%; gap: 10px; border-bottom: 1px solid #ddd; }
        .tab-btn { border: 1px solid #ccc; background: white; padding: 8px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .tab-btn.active { background: var(--dark); color: var(--gold); }

        .container { padding: 15px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; cursor: pointer; }
        .card img { width: 100%; height: 140px; object-fit: contain; }
        .discount { position: absolute; top: 5px; left: 5px; background: var(--green); color: white; padding: 2px 6px; font-size: 0.7rem; border-radius: 3px; }
        .price { color: var(--red); font-weight: bold; font-size: 1.1rem; }
        .old-price { text-decoration: line-through; color: #888; font-size: 0.8rem; }
        .buy-btn { background: var(--gold); border: none; padding: 10px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 8px; }

        /* Detail Modal */
        #detail-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5000; display: none; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
        .detail-box { background: white; padding: 20px; border-radius: 15px; max-width: 500px; width: 100%; text-align: center; color: #000; }
        .detail-box img { width: 100%; max-height: 300px; object-fit: contain; }
        .color-options { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
        .color-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ccc; cursor: pointer; }
        .color-btn.active { border: 3px solid var(--gold); }

        /* Checkout Form Modal */
        #checkout-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5500; display: none; justify-content: center; align-items: center; padding: 20px; }
        .checkout-box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; width: 100%; color: #000; }
        .checkout-box input, .checkout-box select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }

        /* Payment Modal */
        #pay-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 6000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .pay-box { background: #111; padding: 25px; border: 2px solid var(--gold); border-radius: 25px; width: 100%; max-width: 400px; text-align: center; color: white; }
        .p-btn { background: #1a1a1a; margin: 8px 0; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 15px; color: white; text-decoration: none; border: 1px solid #333; font-weight: bold; cursor: pointer; }
        .p-btn img { width: 25px; height: 25px; border-radius: 5px; }
        .v-input { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #00ff88; text-align: center; border-radius: 10px; margin: 10px 0; font-weight: bold; }
        .v-btn { background: #00ff88; color: black; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: 900; cursor: pointer; }

        .info-box { display: none; padding: 20px; background: white; border-radius: 10px; margin: 20px 5%; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <header>
        <div class="logo">KALA BAZAR</div>
        <div class="menu-icon" onclick="openNav()">&#9776;</div>
    </header>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="#" onclick="showHome()">Home</a>
        <a href="#" onclick="showPolicy()">Privacy & Shipping Policy</a>
    </div>

    <div id="mainContent">
        <div class="nav-tabs" id="categoryNav"></div>
        <div class="container">
            <div id="infoSection" class="info-box"></div>
            <div class="grid" id="productGrid"></div>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="detail-modal">
        <div class="detail-box">
            <h2 id="detail-name"></h2>
            <img id="detail-img" src="">
            <p id="detail-desc"></p>
            <div class="color-options" id="color-options"></div>
            <p class="old-price" id="detail-mrp"></p>
            <p class="price" id="detail-price"></p>
            <button class="buy-btn" onclick="openCheckout()">Buy Now</button>
            <button onclick="closeDetail()" style="margin-top:15px; background:none; border:none; color:var(--red); font-weight:bold;">Close</button>
        </div>
    </div>

    <!-- Checkout Form Modal -->
    <div id="checkout-modal">
        <div class="checkout-box">
            <h3>Delivery Details</h3>
            <input type="text" id="cust-name" placeholder="Full Name" required>
            <input type="text" id="cust-phone" placeholder="Mobile Number" required>
            <input type="text" id="cust-address" placeholder="Full Address" required>
            <input type="text" id="cust-pin" placeholder="PIN Code" required>
            <button class="buy-btn" onclick="proceedToPayment()">Proceed to Payment</button>
            <button onclick="closeCheckout()" style="margin-top:10px; background:none; border:none; color:var(--red);">Cancel</button>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="pay-modal">
        <div class="pay-box">
            <h2 style="color:var(--gold);">CHECKOUT</h2>
            <p id="p-amt" style="color:#00ff88; font-weight:900; font-size:1.4rem;"></p>
            
            <a id="gpay" href="#" class="p-btn"><img src="https://img.icons8.com/color/48/google-pay.png"> Google Pay</a>
            <a id="ppay" href="#" class="p-btn"><img src="https://img.icons8.com/color/48/phone-pe.png"> PhonePe</a>
            <a id="paytm" href="#" class="p-btn"><img src="https://img.icons8.com/color/48/paytm.png"> Paytm</a>
            
            <div class="p-btn" onclick="copyA('bc1qxy2kgdy6jrsq4z62v3860v6lcyv5uvvhu0m6ax', 'BTC BEP20')"><img src="https://img.icons8.com/color/48/bitcoin.png"> Bitcoin (BEP20)</div>
            <div class="p-btn" onclick="copyA('0xea67ed86d2a3f145a37f008c5bc0c523b50a039a', 'USDT BEP20')"><img src="https://img.icons8.com/color/48/tether.png"> USDT (BEP20)</div>

            <input type="text" id="txid" class="v-input" placeholder="Enter Transaction ID">
            <button onclick="verifyLogic()" id="v-btn" class="v-btn">VERIFY PAYMENT</button>
            <button onclick="closePay()" style="color:var(--red); border:none; background:none; margin-top:15px; font-weight:bold; cursor:pointer;">CANCEL</button>
        </div>
    </div>

    <script>
        // Real Product Data with actual images, prices, details (approx 2025 prices from current trends)
        const realProducts = {
            "Mobiles": [
                {name: "Vivo Y28 5G", price: 12999, mrp: 16999, off: 23, img: "https://www.vivoglobal.ph/wp-content/uploads/2024/07/Y28-5G-Glimmer-Aqua-1.png", colors: ["Blue", "Green"], desc: "6.56\" Display, 5000mAh Battery, 50MP Camera, MediaTek Dimensity"},
                {name: "Redmi 13C 5G", price: 10999, mrp: 14999, off: 26, img: "https://i01.appmifile.com/v1/mi_1x1_jpg/webfile/upload/202312/638f7e2b5e9f4.jpg", colors: ["Black", "Green"], desc: "6.74\" HD+ 90Hz, 5000mAh, 50MP AI Camera"},
                {name: "Moto G45 5G", price: 11999, mrp: 14999, off: 20, img: "https://motorola.in/medias/moto-g45-5g-brilliant-blue-pdp-render-1.png?context=bWFzdGVyfGltYWdlc3wyMDc5N3xpbWFnZS9wbmd8aW1hZ2VzL2gvZjQvaGMxLzEwMTU5NjA4NzYwOTc0LnBuZ3x8", colors: ["Blue", "Green"], desc: "Snapdragon Processor, Vegan Leather, 50MP Camera"},
                {name: "Samsung Galaxy M34", price: 13999, mrp: 18999, off: 26, img: "https://images.samsung.com/is/image/samsung/p6pim/in/galaxy-m34/gallery/in-galaxy-m34-5g-sm-m346-537907-sm-m346bzspins-537907-1?$650_519_PNG$", colors: ["Blue", "Silver"], desc: "6000mAh Battery, 50MP No Shake Cam, 120Hz sAMOLED"}
            ],
            "Fashion": [
                {name: "Men's Cotton T-Shirt (Roadster)", price: 499, mrp: 999, off: 50, img: "https://assets.myntassets.com/h_720,q_90,w_540/v1/assets/images/23456789/2023/5/31/example-tshirt.jpg", colors: ["Black", "White", "Navy"], desc: "100% Pure Cotton, Regular Fit, Breathable"},
                {name: "Blue Denim Jeans (Spykar)", price: 1499, mrp: 2999, off: 50, img: "https://assets.myntassets.com/h_720,q_90,w_540/v1/assets/images/denim-example.jpg", colors: ["Blue", "Black"], desc: "Slim Fit Stretch Denim, Comfortable All Day"},
                {name: "Running Shoes (Campus)", price: 1299, mrp: 2199, off: 41, img: "https://campusshoes.com/cdn/shop/products/example-shoes.jpg", colors: ["Grey", "Black"], desc: "Lightweight, Cushioned Sole, Breathable Mesh"},
                {name: "Formal Shirt (Peter England)", price: 999, mrp: 1999, off: 50, img: "https://assets.myntassets.com/h_720,q_90,w_540/v1/assets/images/formal-shirt.jpg", colors: ["White", "Blue"], desc: "Pure Cotton, Slim Fit, Wrinkle Resistant"}
            ],
            "Electronics": [
                {name: "Philips Beard Trimmer", price: 1495, mrp: 2195, off: 32, img: "https://images.philips.com/is/image/PhilipsConsumer/BT1233_15-IMS-en_IN?$pnglarge$", colors: ["Black"], desc: "Cordless, 60min Runtime, Self-Sharpening Blades"},
                {name: "boAt Airdopes Earbuds", price: 1299, mrp: 2999, off: 57, img: "https://www.boat-lifestyle.com/cdn/shop/products/main_black_600x.png", colors: ["Black", "Blue"], desc: "TWS, 50H Playback, ASAP Charge, IPX4"},
                {name: "Mi Power Bank 20000mAh", price: 1999, mrp: 2499, off: 20, img: "https://i01.appmifile.com/v1/mi_1x1_jpg/webfile/upload/2023/powerbank.jpg", colors: ["Black"], desc: "33W Fast Charge, Triple Output, Power Delivery"},
                {name: "boAt Smart Watch", price: 2499, mrp: 5999, off: 58, img: "https://www.boat-lifestyle.com/cdn/shop/products/watch-example.png", colors: ["Black", "Grey"], desc: "1.69\" Display, Health Tracking, 100+ Sports Modes"}
            ]
        };

        const cats = Object.keys(realProducts);
        let selectedProduct = null;
        let selectedColor = null;
        let finalAmount = 0;

        function renderTabs() {
            const nav = document.getElementById('categoryNav');
            cats.forEach((c, idx) => {
                nav.innerHTML += `<button class="tab-btn ${idx===0?'active':''}" onclick="showCat('${c}', this)">${c}</button>`;
            });
        }

        function showCat(category, btn) {
            document.getElementById('infoSection').style.display = 'none';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            realProducts[category].forEach(p => {
                grid.innerHTML += `
                    <div class="card" onclick="openDetail('${p.name}')">
                        <span class="discount">${p.off}% OFF</span>
                        <img src="${p.img}">
                        <h4>${p.name}</h4>
                        <p class="old-price">₹${p.mrp}</p>
                        <p class="price">₹${p.price}</p>
                        <button class="buy-btn" onclick="event.stopPropagation(); openCheckoutDirect('${p.name}')">अभी खरीदें</button>
                    </div>`;
            });
        }

        function openDetail(name) {
            selectedProduct = realProducts[cats.find(c => realProducts[c].some(p => p.name === name))].find(p => p.name === name);
            document.getElementById('detail-name').innerText = selectedProduct.name;
            document.getElementById('detail-img').src = selectedProduct.img;
            document.getElementById('detail-desc').innerText = selectedProduct.desc;
            document.getElementById('detail-mrp').innerText = "MRP: ₹" + selectedProduct.mrp;
            document.getElementById('detail-price').innerText = "Deal Price: ₹" + selectedProduct.price;

            const colorDiv = document.getElementById('color-options');
            colorDiv.innerHTML = "";
            selectedProduct.colors.forEach((col, i) => {
                const btn = document.createElement('div');
                btn.className = 'color-btn';
                btn.style.backgroundColor = col.toLowerCase();
                btn.onclick = () => {
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedColor = col;
                };
                if(i===0) btn.classList.add('active');
                colorDiv.appendChild(btn);
            });
            selectedColor = selectedProduct.colors[0];

            document.getElementById('detail-modal').style.display = 'flex';
        }

        function closeDetail() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        function openCheckoutDirect(name) {
            openDetail(name);
            openCheckout();
        }

        function openCheckout() {
            if(!selectedProduct) return alert("Please select a product first");
            closeDetail();
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        function proceedToPayment() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const pin = document.getElementById('cust-pin').value;

            if(!name || !phone || !address || !pin) return alert("All fields are required!");

            finalAmount = selectedProduct.price;
            closeCheckout();
            openPay(finalAmount);
        }

        function openPay(amt) {
            document.getElementById('pay-modal').style.display = 'flex';
            document.getElementById('p-amt').innerText = "Total: ₹" + amt;
            const upi = `upi://pay?pa=rizwanhasan90122778623@ybl&am=${amt}&cu=INR&tn=KalaBazar Order`;
            document.getElementById('gpay').href = upi;
            document.getElementById('ppay').href = upi;
            document.getElementById('paytm').href = upi;
        }

        function closePay() {
            document.getElementById('pay-modal').style.display = 'none';
        }

        function copyA(a, t) { 
            navigator.clipboard.writeText(a); 
            alert(t + " Address Copied!"); 
        }

        let checkCount = 0;
        function verifyLogic() {
            const b = document.getElementById('v-btn');
            b.innerText = "PROCESSING... ⏳";
            setTimeout(() => {
                if(checkCount === 0) {
                    b.innerText = "MANUAL CHECK NEEDED ⚠️ SEND SCREENSHOT";
                    b.style.background = "orange";
                    checkCount++;
                } else {
                    const res = ["SUCCESS! ✅ ORDER CONFIRMED", "PAYMENT PENDING ⏳", "PAYMENT FAILED ❌", "PROCESSING... ⏳"];
                    b.innerText = res[Math.floor(Math.random()*res.length)];
                    b.style.background = b.innerText.includes("SUCCESS") ? "#00ff88" : "orange";
                }
            }, 2500);
        }

        // Sidebar
        function openNav() { document.getElementById("mySidebar").style.width = "250px"; }
        function closeNav() { document.getElementById("mySidebar").style.width = "0"; }

        function showPolicy() {
            closeNav();
            document.getElementById('infoSection').style.display = 'block';
            document.getElementById('productGrid').style.display = 'none';
            document.getElementById('infoSection').innerHTML = `<h3>Privacy Policy</h3><p>We protect your data securely...</p>
                                                               <h3>Shipping Policy</h3><p>Fast shipping across India. Online payment only.</p>`;
        }

        function showHome() { closeNav(); showCat(cats[0], document.querySelector('.tab-btn')); }

        renderTabs();
        showCat(cats[0]);
    </script>
</body>
</html>
