<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALA BAZAR | Elite Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --gold: #f39c12; --dark: #0f0f0f; --card-bg: #1a1a1a; --text: #fff; --glass: rgba(255, 255, 255, 0.1); }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #000; color: var(--text); overflow-x: hidden; }
        
        /* MODERN HEADER */
        header { background: var(--dark); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #333; }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--gold); cursor: pointer; }
        .user-status { font-size: 0.8rem; color: #aaa; }

        /* MODERN GLASS SIDEBAR */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 1999; }
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; right: 0; background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px); overflow-x: hidden; transition: 0.4s; padding-top: 60px; }
        .sidebar-item { padding: 15px 25px; margin: 10px 15px; background: var(--glass); border-radius: 12px; text-decoration: none; color: white; display: flex; align-items: center; gap: 15px; transition: 0.3s; border: 1px solid rgba(255,255,255,0.05); }
        .sidebar-item:hover { background: var(--gold); color: black; transform: translateX(-5px); }
        .closebtn { position: absolute; top: 10px; left: 20px; font-size: 30px; cursor: pointer; color: var(--gold); }

        /* PRODUCT GRID */
        .container { padding: 20px 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card-bg); border-radius: 15px; padding: 12px; border: 1px solid #222; position: relative; }
        .card img { width: 100%; height: 140px; object-fit: contain; border-radius: 10px; }
        .card h4 { font-size: 0.85rem; margin: 10px 0 5px; color: #eee; }
        .price { color: var(--gold); font-weight: bold; font-size: 1.1rem; }

        /* MODAL SYSTEMS */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; display: none; justify-content: center; align-items: center; overflow-y: auto; }
        .modal-content { background: #111; width: 90%; max-width: 450px; border-radius: 20px; padding: 25px; border: 1px solid #333; position: relative; }
        
        /* LOGIN & ADDRESS INPUTS */
        .input-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; margin-top: 5px; }
        .btn-prime { width: 100%; background: var(--gold); color: black; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* COLOR & SIZE BUBBLES */
        .variant-box { display: flex; gap: 10px; margin-top: 10px; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .color-dot.active { border-color: var(--gold); transform: scale(1.1); }
        
        /* ORDERS LIST */
        #orders-list { padding: 10px; }
        .order-item { background: #222; padding: 10px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--gold); }

        /* FOOTER APP BUTTONS */
        .app-store { display: flex; justify-content: center; gap: 10px; margin: 30px 0; }
        .app-store img { height: 35px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.reload()">KALA BAZAR</div>
        <div id="user-display" class="user-status" onclick="openLogin()">Login <i class="fas fa-user"></i></div>
        <div onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div id="sidebar" class="sidebar">
        <span class="closebtn" onclick="toggleSidebar()">×</span>
        <a href="javascript:void(0)" onclick="location.reload()" class="sidebar-item"><i class="fas fa-home"></i> Home</a>
        <a href="javascript:void(0)" onclick="openOrders()" class="sidebar-item"><i class="fas fa-box"></i> My Orders</a>
        <a href="javascript:void(0)" onclick="openAI()" class="sidebar-item"><i class="fas fa-robot"></i> AI Help (Contact)</a>
        <a href="javascript:void(0)" onclick="openPrivacy()" class="sidebar-item"><i class="fas fa-scroll"></i> Privacy Policy</a>
    </div>

    <div class="container">
        <div class="grid" id="productGrid"></div>
    </div>

    <div class="app-store">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg">
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--gold)">Login / Register</h2>
            <input type="text" id="log-phone" placeholder="Mobile Number">
            <input type="password" id="log-pass" placeholder="Password">
            <button class="btn-prime" onclick="saveLogin()">LOGIN NOW</button>
            <button onclick="closeModal('loginModal')" style="background:none; border:none; color:red; width:100%; margin-top:10px;">Cancel</button>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <img id="det-img" style="width:100%; height:200px; object-fit:contain;">
            <h3 id="det-name"></h3>
            <p id="det-price" class="price"></p>
            
            <div class="input-group">
                <label>Select Color:</label>
                <div class="variant-box">
                    <div class="color-dot active" style="background:black" onclick="setVar(this)"></div>
                    <div class="color-dot" style="background:gray" onclick="setVar(this)"></div>
                    <div class="color-dot" style="background:blue" onclick="setVar(this)"></div>
                </div>
            </div>
            <button class="btn-prime" onclick="openAddress()">BUY NOW</button>
            <button onclick="closeModal('detailModal')" style="background:none; border:none; color:red; width:100%; margin-top:10px;">Close</button>
        </div>
    </div>

    <div id="addrModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--gold)">Delivery Address</h3>
            <input type="text" id="cust-name" placeholder="Full Name">
            <input type="text" id="cust-phone" placeholder="Alternative Number">
            <textarea id="cust-addr" placeholder="Full Address (House No, Area, Pincode)"></textarea>
            <button class="btn-prime" onclick="openPayment()">PROCEED TO PAYMENT</button>
            <button onclick="closeModal('addrModal')" style="background:none; border:none; color:red; width:100%; margin-top:10px;">Back</button>
        </div>
    </div>

    <div id="payModal" class="modal">
        <div class="modal-content" style="border:1px solid var(--gold); text-align:center;">
            <h2 style="color:var(--gold)">PAYMENT</h2>
            <div id="final-amt" style="font-size:2rem; margin-bottom:20px; color:#00ff88;"></div>
            
            <button class="btn-prime" style="background:#222; color:white; border:1px solid #444;" onclick="pay('Google Pay')">Google Pay</button>
            <button class="btn-prime" style="background:#222; color:white; border:1px solid #444;" onclick="pay('PhonePe')">PhonePe</button>
            <button class="btn-prime" style="background:#222; color:white; border:1px solid #444;" onclick="pay('Paytm')">Paytm</button>
            <button class="btn-prime" style="background:#222; color:white; border:1px solid #444;" onclick="pay('Crypto')">USDT / BTC</button>
            
            <input type="text" id="utr" placeholder="Enter Transaction ID" style="margin-top:15px; border-color:var(--gold);">
            <button class="btn-prime" style="background:#00ff88; color:black;" onclick="confirmOrder()">VERIFY & PLACE ORDER</button>
        </div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--gold)">My Orders</h3>
            <div id="orders-list"></div>
            <button onclick="closeModal('orderModal')" class="btn-prime">Close</button>
        </div>
    </div>

    <script>
        let allProds = [];
        let selectedProd = {};
        let currentUser = JSON.parse(localStorage.getItem('user')) || null;

        // LOAD DATA
        fetch('products.json').then(r => r.json()).then(data => {
            allProds = data;
            const grid = document.getElementById('productGrid');
            grid.innerHTML = data.map((p, i) => `
                <div class="card" onclick="openDetail(${i})">
                    <img src="${p.img}">
                    <h4>${p.name}</h4>
                    <p class="price">₹${p.price}</p>
                </div>
            `).join('');
            if(currentUser) document.getElementById('user-display').innerText = "Hi, " + currentUser.phone;
        });

        // MODAL HELPERS
        function openDetail(i) {
            selectedProd = allProds[i];
            document.getElementById('det-img').src = selectedProd.img;
            document.getElementById('det-name').innerText = selectedProd.name;
            document.getElementById('det-price').innerText = "₹" + selectedProd.price;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function toggleSidebar() {
            const s = document.getElementById('sidebar');
            const o = document.getElementById('overlay');
            if(s.style.width === '280px') {
                s.style.width = '0'; o.style.display = 'none';
            } else {
                s.style.width = '280px'; o.style.display = 'block';
            }
        }

        function openLogin() { document.getElementById('loginModal').style.display = 'flex'; }
        
        function saveLogin() {
            const phone = document.getElementById('log-phone').value;
            const pass = document.getElementById('log-pass').value;
            if(phone && pass) {
                currentUser = { phone, pass };
                localStorage.setItem('user', JSON.stringify(currentUser));
                document.getElementById('user-display').innerText = "Hi, " + phone;
                closeModal('loginModal');
                alert("Login Success!");
            }
        }

        function openAddress() {
            if(!currentUser) { alert("Please login first!"); openLogin(); return; }
            closeModal('detailModal');
            document.getElementById('addrModal').style.display = 'flex';
        }

        function openPayment() {
            const name = document.getElementById('cust-name').value;
            if(!name) { alert("Please enter name & address"); return; }
            closeModal('addrModal');
            document.getElementById('final-amt').innerText = "Total: ₹" + selectedProd.price;
            document.getElementById('payModal').style.display = 'flex';
        }

        function confirmOrder() {
            const utr = document.getElementById('utr').value;
            if(!utr) { alert("Please enter Transaction ID"); return; }
            
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders.push({
                user: currentUser.phone,
                item: selectedProd.name,
                price: selectedProd.price,
                date: new Date().toLocaleDateString()
            });
            localStorage.setItem('orders', JSON.stringify(orders));
            alert("Order Placed! Order details saved in My Orders.");
            location.reload();
        }

        function openOrders() {
            if(!currentUser) { alert("Login to see orders"); openLogin(); return; }
            const list = document.getElementById('orders-list');
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            let userOrders = orders.filter(o => o.user === currentUser.phone);
            
            list.innerHTML = userOrders.length ? userOrders.map(o => `
                <div class="order-item">
                    <b>${o.item}</b><br>Amount: ₹${o.price} | Date: ${o.date}
                </div>
            `).join('') : "<p>No orders found.</p>";
            document.getElementById('orderModal').style.display = 'flex';
            toggleSidebar();
        }

        function openPrivacy() {
            alert("KALA BAZAR POLICY:\n1. 7-Day Return available on all items.\n2. Refund will be processed within 24 hours.\n3. Safe and Encrypted Payments.");
            toggleSidebar();
        }

        function openAI() { alert("KALA AI Assistant is loading... Type your query."); toggleSidebar(); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function setVar(el) {
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
