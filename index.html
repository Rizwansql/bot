<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALA BAZAR | Best Deals</title>
    <style>
        :root { --dark: #121212; --gold: #f39c12; --red: #e74c3c; --green: #27ae60; --white: #fff; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f7f6; }
        header { background: var(--dark); color: var(--white); padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--gold); }
        .menu-icon { font-size: 1.8rem; cursor: pointer; color: var(--white); }
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; right: 0; background-color: var(--dark); overflow-x: hidden; transition: 0.5s; padding-top: 60px; }
        .sidebar a { padding: 15px 32px; text-decoration: none; font-size: 1.2rem; color: #818181; display: block; transition: 0.3s; }
        .sidebar a:hover { color: var(--gold); }
        .sidebar .closebtn { position: absolute; top: 10px; right: 25px; font-size: 36px; }
        .nav-tabs { background: white; display: flex; overflow-x: auto; padding: 10px 5%; gap: 10px; border-bottom: 1px solid #ddd; }
        .tab-btn { border: 1px solid #ccc; background: white; padding: 8px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .tab-btn.active { background: var(--dark); color: var(--gold); }
        .container { padding: 15px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; cursor: pointer; }
        .card img { width: 100%; height: 140px; object-fit: contain; background: #eee; }
        .discount { position: absolute; top: 5px; left: 5px; background: var(--green); color: white; padding: 2px 6px; font-size: 0.7rem; border-radius: 3px; }
        .price { color: var(--red); font-weight: bold; font-size: 1.1rem; }
        .old-price { text-decoration: line-through; color: #888; font-size: 0.8rem; }
        .buy-btn { background: var(--gold); border: none; padding: 10px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        #detail-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5000; display: none; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
        .detail-box { background: white; padding: 20px; border-radius: 15px; max-width: 500px; width: 100%; text-align: center; color: #000; }
        .detail-box .carousel { display: flex; overflow-x: auto; margin: 10px 0; }
        .detail-box .carousel img { width: 100%; height: 200px; object-fit: contain; margin-right: 10px; }
        .color-options { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
        .color-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ccc; cursor: pointer; }
        .color-btn.active { border: 3px solid var(--gold); }
        .size-select { margin: 10px 0; }
        #checkout-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5500; display: none; justify-content: center; align-items: center; padding: 20px; }
        .checkout-box { background: white; padding: 25px; border-radius: 15px; max-width: 400px; width: 100%; color: #000; }
        .checkout-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        #pay-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 6000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .pay-box { background: #111; padding: 25px; border: 2px solid var(--gold); border-radius: 25px; width: 100%; max-width: 400px; text-align: center; color: white; }
        .p-btn { background: #1a1a1a; margin: 8px 0; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 15px; color: white; text-decoration: none; border: 1px solid #333; font-weight: bold; cursor: pointer; }
        .p-btn img { width: 25px; height: 25px; border-radius: 5px; }
        .v-input { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #00ff88; text-align: center; border-radius: 10px; margin: 10px 0; font-weight: bold; }
        .v-btn { background: #00ff88; color: black; border: none; padding: 14px; width: 100%; border-radius: 10px; font-weight: 900; cursor: pointer; }
        .info-box { display: none; padding: 20px; background: white; border-radius: 10px; margin: 20px 5%; border: 1px solid #ddd; }
        #translate-btn { background: var(--gold); color: var(--dark); padding: 10px 20px; border-radius: 20px; font-weight: bold; margin: 20px auto; display: block; cursor: pointer; width: 80%; }
    </style>
</head>
<body data-lang="hi">

    <header>
        <div class="logo">KALA BAZAR</div>
        <div class="menu-icon" onclick="openNav()">☰</div>
    </header>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">×</a>
        <a href="#" onclick="showHome()" data-en="Home" data-hi="होम">होम</a>
        <a href="#" onclick="showPolicy()" data-en="Privacy and Shipping Policy" data-hi="प्राइवेसी और शिपिंग पॉलिसी">प्राइवेसी और शिपिंग पॉलिसी</a>
        <button id="translate-btn" onclick="toggleLanguage()" data-en="Switch to Hindi" data-hi="Switch to English">Switch to English</button>
    </div>

    <div id="mainContent">
        <div class="nav-tabs" id="categoryNav"></div>
        <div class="container">
            <div id="infoSection" class="info-box"></div>
            <div class="grid" id="productGrid"></div>
        </div>
    </div>

    <div id="detail-modal">
        <div class="detail-box">
            <h2 id="detail-name"></h2>
            <div class="carousel" id="detail-carousel"></div>
            <p id="detail-desc"></p>
            <div class="color-options" id="color-options"></div>
            <select id="size-select" class="size-select">
                <option value="">Select Size</option>
            </select>
            <p class="old-price" id="detail-mrp"></p>
            <p class="price" id="detail-price"></p>
            <button class="buy-btn" onclick="openCheckout()" data-en="Buy Now" data-hi="Buy Now">Buy Now</button>
            <button onclick="closeDetail()" style="margin-top:15px; background:none; border:none; color:var(--red); font-weight:bold;" data-en="Close" data-hi="बंद करें">बंद करें</button>
        </div>
    </div>

    <div id="checkout-modal">
        <div class="checkout-box">
            <h3 data-en="Delivery Details" data-hi="डिलीवरी डिटेल्स">डिलीवरी डिटेल्स</h3>
            <input type="text" id="cust-name" placeholder="पूरा नाम" data-en-placeholder="Full Name" data-hi-placeholder="पूरा नाम">
            <input type="text" id="cust-phone" placeholder="मोबाइल नंबर" data-en-placeholder="Mobile Number" data-hi-placeholder="मोबाइल नंबर">
            <input type="text" id="cust-address" placeholder="पूरा पता" data-en-placeholder="Full Address" data-hi-placeholder="पूरा पता">
            <input type="text" id="cust-pin" placeholder="पिन कोड" data-en-placeholder="PIN Code" data-hi-placeholder="पिन कोड">
            <button class="buy-btn" onclick="proceedToPayment()" data-en="Proceed to Payment" data-hi="पेमेंट पर जाएं">पेमेंट पर जाएं</button>
            <button onclick="closeCheckout()" style="margin-top:10px; background:none; border:none; color:var(--red);" data-en="Cancel" data-hi="कैंसल">कैंसल</button>
        </div>
    </div>

    <div id="pay-modal">
        <div class="pay-box">
            <h2 style="color:var(--gold);" data-en="CHECKOUT" data-hi="चेकआउट">चेकआउट</h2>
            <p id="p-amt" style="color:#00ff88; font-weight:900; font-size:1.4rem;"></p>
            <a id="gpay" href="#" class="p-btn"><img src="https://img.icons8.com/color/48/google-pay.png" alt="GPay"> Google Pay</a>
            <a id="ppay" href="#" class="p-btn"><img src="https://img.icons8.com/color/48/phone-pe.png" alt="PhonePe"> PhonePe</a>
            <a id="paytm" href="#" class="p-btn"><img src="https://img.icons8.com/color/48/paytm.png" alt="Paytm"> Paytm</a>
            <div class="p-btn" onclick="copyA('bc1qxy2kgdy6jrsq4z62v3860v6lcyv5uvvhu0m6ax', 'BTC BEP20')"><img src="https://img.icons8.com/color/48/bitcoin.png" alt="BTC"> Bitcoin (BEP20)</div>
            <div class="p-btn" onclick="copyA('0xea67ed86d2a3f145a37f008c5bc0c523b50a039a', 'USDT BEP20')"><img src="https://img.icons8.com/color/48/tether.png" alt="USDT"> USDT (BEP20)</div>
            <input type="text" id="txid" class="v-input" placeholder="ट्रांजेक्शन ID डालें" data-en-placeholder="Enter Transaction ID" data-hi-placeholder="ट्रांजेक्शन ID डालें">
            <button onclick="verifyLogic()" id="v-btn" class="v-btn" data-en="VERIFY PAYMENT" data-hi="पेमेंट वेरिफाई करें">पेमेंट वेरिफाई करें</button>
            <button onclick="closePay()" style="color:var(--red); border:none; background:none; margin-top:15px; font-weight:bold; cursor:pointer;" data-en="CANCEL" data-hi="कैंसल">कैंसल</button>
        </div>
    </div>

    <script>
        const realProducts = {
            "Mobiles": new Array(50).fill(0).map((_, i) => ({
                name: `Mobile ${i + 1} (e.g., Vivo Y28 5G)`, price: 12999 + i * 100, mrp: 16999 + i * 100, off: 23 + i % 10, img: `https://m.media-amazon.com/images/I/71EPrLqHHjL._SX679_.jpg`, images: [`https://m.media-amazon.com/images/I/71EPrLqHHjL._SX679_.jpg`, `https://m.media-amazon.com/images/I/81Ic1SbN8UL._SX679_.jpg`], colors: ["Blue", "Green"], desc: "5000mAh Battery, 50MP Camera", sizes: []
            })),
            "Fashion": new Array(50).fill(0).map((_, i) => ({
                name: `Fashion Item ${i + 1} (e.g., Roadster T-Shirt)`, price: 499 + i * 10, mrp: 999 + i * 10, off: 50, img: `https://m.media-amazon.com/images/I/81something-tshirt.jpg`, images: [`https://m.media-amazon.com/images/I/81something-tshirt.jpg`, `https://m.media-amazon.com/images/I/71another.jpg`], colors: ["Black", "White"], desc: "Cotton Regular Fit", sizes: ["S", "M", "L", "XL"]
            })),
            "Electronics": new Array(50).fill(0).map((_, i) => ({
                name: `Gadget ${i + 1} (e.g., QUBO Smart Plug)`, price: 999 + i * 20, mrp: 1999 + i * 20, off: 50, img: `https://m.media-amazon.com/images/I/71smartplug.jpg`, images: [`https://m.media-amazon.com/images/I/71smartplug.jpg`, `https://m.media-amazon.com/images/I/81doorbell.jpg`], colors: ["White"], desc: "Smart Home Device", sizes: []
            })),
            "Toys": new Array(50).fill(0).map((_, i) => ({
                name: `Toy ${i + 1} (e.g., LEGO Classic Set)`, price: 1499 + i * 30, mrp: 2499 + i * 30, off: 40, img: `https://m.media-amazon.com/images/I/71lego.jpg`, images: [`https://m.media-amazon.com/images/I/71lego.jpg`, `https://m.media-amazon.com/images/I/81barbie.jpg`], colors: ["Multi"], desc: "Educational Toy", sizes: []
            }))
        };

        const cats = Object.keys(realProducts);
        let selectedProduct = null;
        let checkCount = 0;

        function renderTabs() {
            const nav = document.getElementById('categoryNav');
            nav.innerHTML = '';
            cats.forEach((c, idx) => {
                nav.innerHTML += `<button class="tab-btn ${idx===0?'active':''}" onclick="showCat('${c}', this)" data-en="${c}" data-hi="${c}">${c}</button>`;
            });
        }

        function showCat(category, btn) {
            document.getElementById('infoSection').style.display = 'none';
            document.getElementById('productGrid').style.display = 'grid';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            realProducts[category].forEach(p => {
                grid.innerHTML += `
                    <div class="card" onclick="openDetail(${JSON.stringify(p)})">
                        <span class="discount">${p.off}% OFF</span>
                        <img src="${p.img}" alt="${p.name}">
                        <h4>${p.name}</h4>
                        <p class="old-price">₹${p.mrp}</p>
                        <p class="price">₹${p.price}</p>
                        <button class="buy-btn" onclick="event.stopPropagation(); selectedProduct = ${JSON.stringify(p)}; openCheckout()" data-en="Buy Now" data-hi="Buy Now">Buy Now</button>
                    </div>`;
            });
        }

        function openDetail(p) {
            selectedProduct = p;
            document.getElementById('detail-name').innerText = p.name;
            const carousel = document.getElementById('detail-carousel');
            carousel.innerHTML = '';
            p.images.forEach(src => {
                carousel.innerHTML += `<img src="${src}" alt="${p.name}">`;
            });
            document.getElementById('detail-desc').innerText = p.desc;
            const colorDiv = document.getElementById('color-options');
            colorDiv.innerHTML = '';
            p.colors.forEach((col, i) => {
                colorDiv.innerHTML += `<div class="color-btn ${i===0?'active':''}" style="background-color:${col.toLowerCase()};" onclick="document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active')); this.classList.add('active');"></div>`;
            });
            const sizeSelect = document.getElementById('size-select');
            sizeSelect.style.display = p.sizes.length ? 'block' : 'none';
            sizeSelect.innerHTML = '<option value="">Select Size</option>';
            p.sizes.forEach(size => {
                sizeSelect.innerHTML += `<option value="${size}">${size}</option>`;
            });
            document.getElementById('detail-mrp').innerText = `MRP: ₹${p.mrp}`;
            document.getElementById('detail-price').innerText = `₹${p.price}`;
            document.getElementById('detail-modal').style.display = 'flex';
        }

        function closeDetail() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        function openCheckout() {
            closeDetail();
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        function proceedToPayment() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const pin = document.getElementById('cust-pin').value;
            if (!name || !phone || !address || !pin) return alert("All fields are required!");
            closeCheckout();
            openPay(selectedProduct.price);
        }

        function openPay(amt) {
            document.getElementById('pay-modal').style.display = 'flex';
            document.getElementById('p-amt').innerText = "Total: ₹" + amt;
            const upi = `upi://pay?pa=rizwanhasan90122778623@ybl&am=${amt}&cu=INR`;
            document.getElementById('gpay').href = upi;
            document.getElementById('ppay').href = upi;
            document.getElementById('paytm').href = upi;
            checkCount = 0;
        }

        function closePay() {
            document.getElementById('pay-modal').style.display = 'none';
        }

        function copyA(a, t) { 
            navigator.clipboard.writeText(a); 
            alert(t + " Address Copied!"); 
        }

        function verifyLogic() {
            const b = document.getElementById('v-btn');
            b.innerText = "PROCESSING... ⏳";
            setTimeout(() => {
                if(checkCount === 0) {
                    b.innerText = "MANUAL CHECK NEEDED ⚠️ SEND SCREENSHOT";
                    b.style.background = "orange";
                    checkCount++;
                } else {
                    const res = ["SUCCESS! ✅ ORDER CONFIRMED", "PAYMENT PENDING ⏳", "PAYMENT FAILED ❌", "PROCESSING... ⏳"];
                    b.innerText = res[Math.floor(Math.random()*res.length)];
                    b.style.background = b.innerText.includes("SUCCESS") ? "#00ff88" : "orange";
                }
            }, 2500);
        }

        function openNav() { document.getElementById("mySidebar").style.width = "250px"; }
        function closeNav() { document.getElementById("mySidebar").style.width = "0"; }

        function showPolicy() {
            closeNav();
            const section = document.getElementById('infoSection');
            document.getElementById('productGrid').style.display = 'none';
            section.style.display = 'block';
            section.innerHTML = `<h3 data-en="Privacy Policy" data-hi="Privacy Policy">Privacy Policy</h3><p>KALA BAZAR is committed to your security...</p>
                                 <h3 data-en="Shipping Policy" data-hi="Shipping Policy">Shipping Policy</h3><p>Orders are shipped within 24 hours. No COD allowed.</p>`;
            updateLanguage();
        }

        function showHome() { closeNav(); showCat(cats[0], document.querySelector('.tab-btn')); }

        function toggleLanguage() {
            const lang = document.body.dataset.lang === 'hi' ? 'en' : 'hi';
            document.body.dataset.lang = lang;
            document.getElementById('translate-btn').innerText = lang === 'hi' ? 'Switch to English' : 'हिंदी में स्विच करें';
            updateLanguage();
            renderTabs();
            showCat(cats[0]);
        }

        function updateLanguage() {
            const lang = document.body.dataset.lang || 'hi';
            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerText = el.dataset[lang];
            });
            document.querySelectorAll('input[data-en-placeholder]').forEach(el => {
                el.placeholder = el.dataset[lang + '-placeholder'];
            });
        }

        renderTabs();
        showCat(cats[0]);
        updateLanguage();
    </script>
</body>
</html>
