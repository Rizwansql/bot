<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALA BAZAR | Modern Store</title>
    <style>
        :root { --gold: #ff9f43; --dark: #121212; }
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; }
        header { background: var(--dark); color: white; padding: 15px; text-align: center; font-size: 1.5rem; font-weight: bold; color: var(--gold); }
        .container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: white; padding: 10px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 120px; object-fit: contain; }
        .price { color: green; font-weight: bold; }
        
        /* AI Button Design */
        #ai-btn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: linear-gradient(135deg, #6c5ce7, #a29bfe); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 2px solid white; }
        
        #chat-box { position: fixed; bottom: 90px; right: 20px; width: 300px; height: 400px; background: white; border-radius: 15px; display: none; flex-direction: column; box-shadow: 0 5px 25px rgba(0,0,0,0.2); z-index: 1001; overflow: hidden; }
        .chat-head { background: #6c5ce7; color: white; padding: 10px; font-weight: bold; }
        .chat-body { flex: 1; padding: 10px; overflow-y: auto; font-size: 14px; }
        .chat-input { display: flex; border-top: 1px solid #eee; }
        .chat-input input { flex: 1; border: none; padding: 10px; outline: none; }
        
        /* Payment Modal */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:2000; }
        .modal-inner { background:white; padding:20px; border-radius:15px; width:90%; max-width:350px; }
        .pay-btn { background: #222; color: var(--gold); border: 1px solid var(--gold); width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<header>KALA BAZAR</header>

<div class="container" id="products"></div>

<div id="ai-btn" onclick="document.getElementById('chat-box').style.display='flex'">✨</div>

<div id="chat-box">
    <div class="chat-head">KALA AI Assistant <span onclick="document.getElementById('chat-box').style.display='none'" style="float:right; cursor:pointer;">×</span></div>
    <div class="chat-body" id="msgs"><div><b>AI:</b> नमस्ते! मैं आपकी क्या मदद कर सकता हूँ?</div></div>
    <div class="chat-input">
        <input type="text" id="ai-in" placeholder="Type here...">
        <button onclick="askAI()" style="padding:10px; background:none; border:none; cursor:pointer;">🚀</button>
    </div>
</div>

<div id="payModal" class="modal">
    <div class="modal-inner">
        <h3>Payment Method</h3>
        <div class="pay-btn" onclick="alert('Card system logic added!')">💳 Credit / Debit Card</div>
        <div class="pay-btn" onclick="window.location.href='upi://pay?pa=rizwanhasan90122778623@ybl&am=100'">📱 UPI (PhonePe/GPay)</div>
        <div class="pay-btn" onclick="alert('BTC Address: bc1q... Copied!')">₿ Bitcoin / USDT</div>
        <button onclick="document.getElementById('payModal').style.display='none'" style="color:red; background:none; border:none; width:100%; margin-top:10px;">Cancel</button>
    </div>
</div>

<script>
    // 1. Load Products from JSON
    fetch('products.json')
        .then(r => r.json())
        .then(data => {
            const div = document.getElementById('products');
            div.innerHTML = data.map(p => `
                <div class="card" onclick="document.getElementById('payModal').style.display='flex'">
                    <img src="${p.img}">
                    <h4>${p.name}</h4>
                    <p class="price">₹${p.price}</p>
                    <button style="background:black; color:orange; border:none; padding:5px 10px; border-radius:5px;">Buy</button>
                </div>
            `).join('');
        });

    // 2. Simple AI Logic
    function askAI() {
        const inp = document.getElementById('ai-in');
        const box = document.getElementById('msgs');
        if(!inp.value) return;
        
        box.innerHTML += `<div><b>You:</b> ${inp.value}</div>`;
        let reply = "बहुत अच्छा! क्या आप इस प्रोडक्ट को खरीदना चाहेंगे?";
        if(inp.value.includes("price")) reply = "हमारे दाम सबसे कम हैं!";
        
        setTimeout(() => {
            box.innerHTML += `<div><b>AI:</b> ${reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }, 500);
        inp.value = "";
    }
</script>
</body>
</html>
