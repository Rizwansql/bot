<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALA BAZAR | Best Deals Only</title>
    <style>
        :root {
            --dark: #121212;
            --gold: #f39c12;
            --sale-red: #e74c3c;
            --green: #27ae60;
            --white: #ffffff;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f8f9fa; color: #333; }
        
        /* Header & Logo */
        header { 
            background: var(--dark); 
            color: var(--white); 
            padding: 15px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .logo { font-size: 1.8rem; font-weight: 800; color: var(--gold); text-transform: uppercase; }

        /* Category Tabs */
        .nav-tabs {
            background: white;
            display: flex;
            overflow-x: auto;
            padding: 10px 5%;
            gap: 15px;
            border-bottom: 1px solid #ddd;
        }

        .tab-btn {
            border: 2px solid #eee;
            background: white;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            transition: 0.3s;
        }

        .tab-btn.active { background: var(--dark); color: var(--gold); border-color: var(--dark); }

        /* Product Grid */
        .container { padding: 20px 5%; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
        }

        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 15px; 
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.3s;
            position: relative;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }

        .discount-badge {
            position: absolute; top: 10px; left: 10px;
            background: var(--green); color: white;
            padding: 3px 8px; font-size: 0.8rem; font-weight: bold; border-radius: 4px;
        }

        .card img { width: 100%; height: 160px; object-fit: contain; margin-bottom: 10px; }
        .card h4 { font-size: 0.95rem; margin: 10px 0; height: 40px; overflow: hidden; }
        .old-price { text-decoration: line-through; color: #888; font-size: 0.85rem; }
        .price { font-size: 1.2rem; color: var(--sale-red); font-weight: bold; }

        .buy-now { 
            background: var(--gold); color: black; 
            border: none; padding: 10px; width: 100%; 
            border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }

        /* Modal */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center;
        }

        .modal-content { 
            background: white; width: 90%; max-width: 400px; padding: 30px; 
            border-radius: 15px; text-align: center; 
        }

        .modal-content input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .confirm-btn { background: var(--green); color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .cancel-link { display: block; margin-top: 15px; color: #666; cursor: pointer; font-size: 0.9rem; }

        /* Responsive */
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; } .card { padding: 10px; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">KALA BAZAR</div>
        <div style="font-size: 0.8rem;">Logged in: Rizwan</div>
    </header>

    <div class="nav-tabs" id="categoryNav">
        </div>

    <div class="container">
        <div class="grid" id="productGrid"></div>
    </div>

    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h3>🔒 सुरक्षित भुगतान</h3>
            <p style="font-size: 0.9rem; color: #d35400;"><b>Cash on Delivery (COD) उपलब्ध नहीं है।</b></p>
            <p>कृपया ऑनलाइन पेमेंट करें और ट्रांजेक्शन आईडी यहाँ लिखें:</p>
            <input type="text" id="txnInput" placeholder="Enter Transaction ID">
            <button class="confirm-btn" onclick="verifyTxn()">ऑर्डर कन्फर्म करें</button>
            <span class="cancel-link" onclick="closeModal()">वापस जाएं</span>
        </div>
    </div>

    <script>
        const cats = ["Electronics", "Mobiles", "Fashion", "Kitchen", "Beauty"];
        let allProducts = [];

        // 100-100 रैंडम प्रोडक्ट्स बनाने का फंक्शन
        function generateStock() {
            cats.forEach(cat => {
                for (let i = 1; i <= 100; i++) {
                    let mrp = Math.floor(Math.random() * (5000 - 1000) + 1000);
                    let offPercent = Math.floor(Math.random() * (85 - 40) + 40); // 40% to 85% OFF
                    let finalPrice = Math.floor(mrp * (1 - offPercent / 100));

                    allProducts.push({
                        id: cat + i,
                        category: cat,
                        name: `${cat} Premium Item #${i}`,
                        price: finalPrice,
                        mrp: mrp,
                        off: offPercent,
                        img: `https://picsum.photos/300/300?random=${cat}${i}`
                    });
                }
            });
        }

        function renderTabs() {
            const nav = document.getElementById('categoryNav');
            cats.forEach((c, idx) => {
                nav.innerHTML += `<button class="tab-btn ${idx===0?'active':''}" onclick="showCat('${c}', this)">${c}</button>`;
            });
        }

        function showCat(category, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            
            const filtered = allProducts.filter(p => p.category === category);
            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <span class="discount-badge">${p.off}% OFF</span>
                        <img src="${p.img}" alt="prod">
                        <h4>
