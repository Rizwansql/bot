<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALA BAZAR | Best Deals</title>
    <style>
        :root { --dark: #121212; --gold: #f39c12; --red: #e74c3c; --green: #27ae60; --white: #fff; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f7f6; }

        /* Header & Sidebar Menu */
        header { 
            background: var(--dark); color: var(--white); padding: 12px 5%; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--gold); }
        .menu-icon { font-size: 1.8rem; cursor: pointer; color: var(--white); }

        /* Sidebar Styling */
        .sidebar {
            height: 100%; width: 0; position: fixed; z-index: 2000; top: 0; right: 0;
            background-color: var(--dark); overflow-x: hidden; transition: 0.5s; padding-top: 60px;
        }
        .sidebar a { padding: 15px 32px; text-decoration: none; font-size: 1.2rem; color: #818181; display: block; transition: 0.3s; }
        .sidebar a:hover { color: var(--gold); }
        .sidebar .closebtn { position: absolute; top: 10px; right: 25px; font-size: 36px; }

        /* Category Navigation */
        .nav-tabs { background: white; display: flex; overflow-x: auto; padding: 10px 5%; gap: 10px; border-bottom: 1px solid #ddd; }
        .tab-btn { border: 1px solid #ccc; background: white; padding: 8px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .tab-btn.active { background: var(--dark); color: var(--gold); }

        /* Product Grid */
        .container { padding: 15px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .card img { width: 100%; height: 140px; object-fit: contain; }
        .discount { position: absolute; top: 5px; left: 5px; background: var(--green); color: white; padding: 2px 6px; font-size: 0.7rem; border-radius: 3px; }
        .price { color: var(--red); font-weight: bold; font-size: 1.1rem; }
        .old-price { text-decoration: line-through; color: #888; font-size: 0.8rem; }
        .buy-btn { background: var(--gold); border: none; padding: 10px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 8px; }

        /* Login Modal Simulation */
        .login-box { display: none; padding: 20px; background: white; border-radius: 10px; margin-top: 20px; border: 1px solid #ddd; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

    <header>
        <div class="logo">KALA BAZAR</div>
        <div class="menu-icon" onclick="openNav()">&#9776;</div>
    </header>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="#" onclick="showHome()">Home</a>
        <a href="#" onclick="showLogin()">Login (Mobile/Gmail)</a>
        <a href="#" onclick="showPolicy()">Privacy Policy</a>
        <a href="#" onclick="showPolicy()">Shipping Policy</a>
    </div>

    <div id="mainContent">
        <div class="nav-tabs" id="categoryNav"></div>
        <div class="container">
            <div id="infoSection" class="login-box"></div>
            <div class="grid" id="productGrid"></div>
        </div>
    </div>

    <script>
        // Specific Product Data for each category
        const data = {
            "Mobiles": ["Vivo Y16", "Infinix Hot 30", "Oppo A17", "Realme C53", "Poco C51", "Redmi A2"],
            "Fashion": ["Cotton T-Shirt", "Blue Denim Jeans", "Running Shoes", "Casual Slippers", "Formal Shirt", "Sports Tracksuit"],
            "Electronics": ["Trimmer Gold", "Bluetooth Earbuds", "Fast Charger", "Power Bank", "Smart Watch", "Mini Speaker"]
        };

        const cats = Object.keys(data);
        let allProducts = [];

        function generateProducts() {
            cats.forEach(cat => {
                for (let i = 1; i <= 100; i++) {
                    let randomName = data[cat][Math.floor(Math.random() * data[cat].length)];
                    let mrp = Math.floor(Math.random() * (4000 - 1000) + 1000);
                    let off = Math.floor(Math.random() * (80 - 40) + 40);
                    let price = Math.floor(mrp * (1 - off / 100));

                    allProducts.push({
                        category: cat,
                        name: `${randomName} (${i})`,
                        price: price,
                        mrp: mrp,
                        off: off,
                        img: `https://picsum.photos/300/300?random=${cat}${i}`
                    });
                }
            });
        }

        function renderTabs() {
            const nav = document.getElementById('categoryNav');
            cats.forEach((c, idx) => {
                nav.innerHTML += `<button class="tab-btn ${idx===0?'active':''}" onclick="showCat('${c}', this)">${c}</button>`;
            });
        }

        function showCat(category, btn) {
            document.getElementById('infoSection').style.display = 'none';
            document.getElementById('productGrid').style.display = 'grid';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            const filtered = allProducts.filter(p => p.category === category);
            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <span class="discount">${p.off}% OFF</span>
                        <img src="${p.img}">
                        <h4>${p.name}</h4>
                        <p class="old-price">₹${p.mrp}</p>
                        <p class="price">₹${p.price}</p>
                        <button class="buy-btn" onclick="alert('COD Not Available! Use Online Payment.')">अभी खरीदें</button>
                    </div>`;
            });
        }

        // Sidebar Functions
        function openNav() { document.getElementById("mySidebar").style.width = "250px"; }
        function closeNav() { document.getElementById("mySidebar").style.width = "0"; }

        function showLogin() {
            closeNav();
            const section = document.getElementById('infoSection');
            document.getElementById('productGrid').style.display = 'none';
            section.style.display = 'block';
            section.innerHTML = `<h3>Login to KALA BAZAR</h3>
                <input type="text" placeholder="Mobile Number or Email">
                <button class="buy-btn">Continue</button>`;
        }

        function showPolicy() {
            closeNav();
            const section = document.getElementById('infoSection');
            document.getElementById('productGrid').style.display = 'none';
            section.style.display = 'block';
            section.innerHTML = `<h3>Privacy Policy</h3><p>KALA BAZAR is committed to your security. We don't share data with third parties...</p>
                                 <h3>Shipping Policy</h3><p>Orders are shipped within 24 hours. No COD allowed.</p>`;
        }

        function showHome() { closeNav(); showCat(cats[0], document.querySelector('.tab-btn')); }

        generateProducts();
        renderTabs();
        showCat(cats[0]);
    </script>
</body>
</html>
