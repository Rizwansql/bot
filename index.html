<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALA BAZAR | Modern Shop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --gold: #ff9f43; --dark: #0f0f0f; --glass: rgba(255, 255, 255, 0.08); --accent: #ffcc00; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background: #000; color: white; }

        /* HEADER */
        header { background: #111; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--gold); cursor: pointer; text-transform: uppercase; }

        /* NEW MODERN SIDEBAR (Based on your image) */
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 5000; top: 0; right: 0; background: #0a0a0a; overflow-x: hidden; transition: 0.3s; border-left: 1px solid #333; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-menu { padding: 10px; }
        .menu-btn { width: 90%; margin: 8px auto; padding: 15px; background: transparent; border-radius: 10px; display: flex; align-items: center; gap: 15px; color: white; text-decoration: none; transition: 0.2s; border-bottom: 0.5px solid #222; }
        .menu-btn i { font-size: 20px; color: var(--gold); }
        .menu-btn:active { background: var(--glass); }
        .menu-btn span { font-weight: 500; font-size: 16px; }

        /* PRODUCT CARD & WATERMARK */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: #151515; border-radius: 12px; padding: 10px; position: relative; border: 1px solid #222; }
        .card img { width: 100%; border-radius: 8px; }
        .price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
        .price { color: #00ff88; font-weight: bold; font-size: 1.1rem; }
        
        /* Flipkart Style Watermark */
        .watermark { font-size: 0.65rem; background: rgba(255, 204, 0, 0.1); color: var(--gold); padding: 2px 5px; border-radius: 4px; border: 0.5px solid rgba(255, 204, 0, 0.3); font-weight: bold; }

        /* MODALS (Fixed Front Layering) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(5px); }
        .modal-content { background: #1a1a1a; width: 85%; max-width: 400px; padding: 25px; border-radius: 20px; border: 1px solid #333; position: relative; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; background: #252525; border: 1px solid #444; color: white; border-radius: 8px; outline: none; }
        .btn-buy { width: 100%; padding: 12px; background: var(--gold); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; z-index: 4000; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.reload()">KALA BAZAR</div>
        <i class="fas fa-bars" style="font-size: 24px;" onclick="openMenu()"></i>
    </header>

    <div id="overlay" class="overlay" onclick="closeMenu()"></div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span style="color:var(--gold); font-weight:bold;">MENU</span>
            <i class="fas fa-times" onclick="closeMenu()" style="font-size: 24px;"></i>
        </div>
        <div class="sidebar-menu">
            <a href="#" class="menu-btn" onclick="location.reload()"><i class="fas fa-home"></i> <span>Refresh Hub</span></a>
            <a href="#" class="menu-btn" id="login-menu-btn" onclick="openLogin()"><i class="fas fa-user-circle"></i> <span>User Login</span></a>
            <a href="#" class="menu-btn" onclick="openOrders()"><i class="fas fa-box"></i> <span>My Orders</span></a>
            <a href="#" class="menu-btn" onclick="openAI()"><i class="fas fa-robot"></i> <span>AI Help (Chat)</span></a>
            <a href="#" class="menu-btn" onclick="openPrivacy()"><i class="fas fa-shield-alt"></i> <span>Privacy Policy</span></a>
            <a href="https://t.me/yourlink" class="menu-btn"><i class="fab fa-telegram"></i> <span>Join Telegram</span></a>
        </div>
    </div>

    <div class="grid" id="productGrid"></div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:var(--gold);">Sign In</h3>
            <p style="font-size: 0.8rem; color: #aaa;">Enter details to continue</p>
            <input type="text" id="phone" placeholder="Mobile Number">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn-buy" onclick="doLogin()">LOGIN NOW</button>
            <button onclick="closeModal('loginModal')" style="background:none; border:none; color:#ff4444; width:100%; margin-top:15px;">Close</button>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <img id="m-img" style="width:100%; border-radius:10px;">
            <h2 id="m-name" style="font-size: 1.2rem; margin:10px 0;"></h2>
            <div id="m-price" class="price" style="font-size:1.5rem; margin-bottom:15px;"></div>
            <button class="btn-buy" onclick="handleBuy()">BUY NOW</button>
            <button onclick="closeModal('productModal')" style="background:none; border:none; color:white; width:100%; margin-top:10px;">Back</button>
        </div>
    </div>

    <script>
        let products = [];
        let loggedInUser = JSON.parse(localStorage.getItem('user')) || null;

        // Fetch Products
        fetch('products.json').then(r => r.json()).then(data => {
            products = data;
            renderProducts();
            updateUI();
        });

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map((p, i) => `
                <div class="card" onclick="openProduct(${i})">
                    <img src="${p.img}">
                    <h4 style="margin:8px 0; font-size:0.9rem;">${p.name}</h4>
                    <div class="price-row">
                        <span class="price">₹${p.price}</span>
                        <span class="watermark">KALA BAZAR</span>
                    </div>
                </div>
            `).join('');
        }

        function openMenu() {
            document.getElementById('sidebar').style.width = "280px";
            document.getElementById('overlay').style.display = "block";
        }

        function closeMenu() {
            document.getElementById('sidebar').style.width = "0";
            document.getElementById('overlay').style.display = "none";
        }

        let currentItem = null;
        function openProduct(i) {
            currentItem = products[i];
            document.getElementById('m-img').src = currentItem.img;
            document.getElementById('m-name').innerText = currentItem.name;
            document.getElementById('m-price').innerText = "₹" + currentItem.price;
            document.getElementById('productModal').style.display = "flex";
        }

        function handleBuy() {
            if(!loggedInUser) {
                closeModal('productModal');
                openLogin(); // Opens Login on top
            } else {
                alert("Proceeding to Address & Payment for " + currentItem.name);
                // Here you can add your address form logic
            }
        }

        function openLogin() {
            document.getElementById('loginModal').style.display = "flex";
            closeMenu();
        }

        function doLogin() {
            const p = document.getElementById('phone').value;
            if(p.length > 5) {
                loggedInUser = { phone: p };
                localStorage.setItem('user', JSON.stringify(loggedInUser));
                updateUI();
                closeModal('loginModal');
                alert("Welcome back!");
            }
        }

        function updateUI() {
            if(loggedInUser) {
                document.getElementById('login-menu-btn').innerHTML = `<i class="fas fa-user-check"></i> <span>Hi, ${loggedInUser.phone}</span>`;
            }
        }

        function openAI() {
            alert("KALA AI Assistant: Hello! How can I help you today?\n(System is now active)");
            closeMenu();
        }

        function openPrivacy() {
            alert("PRIVACY POLICY:\n- 7 Days Return Policy.\n- Refund in 24 Hours.\n- Your data is safe with KALA BAZAR.");
            closeMenu();
        }

        function openOrders() {
            if(!loggedInUser) { openLogin(); return; }
            alert("Opening your orders...");
            closeMenu();
        }

        function closeModal(id) { document.getElementById(id).style.display = "none"; }
    </script>
</body>
</html>
