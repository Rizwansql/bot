<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALA BAZAR | Modern Shop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --gold: #ff9f43; --dark: #0a0a0a; --green: #00ff88; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #000; color: white; }

        header { background: #111; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.3rem; font-weight: bold; color: var(--gold); }

        /* SIDEBAR */
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 5000; top: 0; right: 0; background: #0d0d0d; transition: 0.3s; border-left: 1px solid #333; overflow-y: auto; }
        .menu-list { padding: 10px; display: flex; flex-direction: column; height: 90%; }
        .menu-item { display: flex; align-items: center; gap: 15px; padding: 15px; color: white; text-decoration: none; border-bottom: 1px solid #1a1a1a; }
        .menu-item i { color: var(--gold); width: 25px; }
        .login-item { margin-top: auto; border-top: 1px solid #333; background: rgba(255,160,67,0.1); }

        /* PRODUCT GRID & CARDS */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: #111; border-radius: 12px; padding: 10px; border: 1px solid #222; display: flex; flex-direction: column; }
        .card img { width: 100%; border-radius: 8px; }
        .price-section { margin-top: 8px; text-align: left; }
        .price { color: var(--green); font-weight: bold; font-size: 1.1rem; display: block; }
        
        /* Left Side Small Watermark */
        .watermark { font-size: 8px; color: var(--gold); opacity: 0.8; display: block; margin-top: 2px; font-weight: bold; letter-spacing: 0.5px; }

        /* Direct Buy Button on Home */
        .direct-buy { background: var(--gold); color: black; border: none; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; margin-top: 10px; cursor: pointer; width: 100%; }

        /* MODALS */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; display: none; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #1a1a1a; width: 100%; max-width: 400px; padding: 25px; border-radius: 15px; border: 1px solid #333; text-align: center; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn-gmail { background: white; color: black; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 4000; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.reload()">KALA BAZAR</div>
        <i class="fas fa-bars" onclick="openMenu()" style="font-size:24px; color:white;"></i>
    </header>

    <div id="overlay" class="overlay" onclick="closeMenu()"></div>

    <div id="sidebar" class="sidebar">
        <div style="padding:20px; border-bottom:1px solid #222; display:flex; justify-content:space-between;">
            <span style="color:var(--gold)">KALA MENU</span>
            <i class="fas fa-times" onclick="closeMenu()"></i>
        </div>
        <div class="menu-list">
            <a href="#" class="menu-item" onclick="location.reload()"><i class="fas fa-home"></i> <span>Home Hub</span></a>
            <a href="#" class="menu-item" onclick="openOrders()"><i class="fas fa-shopping-bag"></i> <span>My Orders</span></a>
            <a href="#" class="menu-item" onclick="openAI()"><i class="fas fa-comment-dots"></i> <span>AI Assistant</span></a>
            <a href="#" class="menu-item" onclick="openPrivacy()"><i class="fas fa-user-shield"></i> <span>Privacy</span></a>
            <a href="#" class="menu-item login-item" onclick="openLogin()"><i class="fas fa-sign-in-alt"></i> <span>Login / Sign Up</span></a>
        </div>
    </div>

    <div class="grid" id="productGrid"></div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--gold)">Welcome Back</h3>
            <button class="direct-buy btn-gmail" onclick="alert('Google Login Selected')">
                <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" width="18"> Continue with Gmail
            </button>
            <div style="margin: 15px 0; color:#555;">OR</div>
            <input type="number" id="phone" placeholder="Enter Mobile Number">
            <input type="password" id="pass" placeholder="Password">
            <button class="direct-buy" onclick="doLogin()">LOGIN NOW</button>
            <button onclick="closeModal('loginModal')" style="background:none; border:none; color:red; margin-top:15px;">Close</button>
        </div>
    </div>

    <div id="addrModal" class="modal">
        <div class="modal-content" style="text-align:left;">
            <h3 style="color:var(--gold); text-align:center;">Delivery Address</h3>
            <input type="text" id="name" placeholder="Full Name">
            <input type="text" id="city" placeholder="City & Pincode">
            <textarea id="addr" style="width:100%; background:#222; border:1px solid #444; border-radius:8px; padding:10px; color:white; margin-top:10px;" rows="3" placeholder="Full Address"></textarea>
            <button class="direct-buy" style="margin-top:15px;" onclick="alert('Proceeding to Payment...')">NEXT: PAYMENT</button>
            <button onclick="closeModal('addrModal')" style="background:none; border:none; color:red; width:100%; margin-top:10px;">Cancel</button>
        </div>
    </div>

    <script>
        let products = [];
        let isUserIn = false; // Reset every time

        fetch('products.json').then(r => r.json()).then(data => {
            products = data;
            const grid = document.getElementById('productGrid');
            grid.innerHTML = data.map((p, i) => `
                <div class="card">
                    <img src="${p.img}" onclick="alert('Opening Details...')">
                    <h4 style="margin:8px 0; font-size:0.85rem; height:35px; overflow:hidden;">${p.name}</h4>
                    <div class="price-section">
                        <span class="price">₹${p.price}</span>
                        <span class="watermark">KALA BAZAR</span>
                    </div>
                    <button class="direct-buy" onclick="handleBuyNow(${i})">BUY NOW</button>
                </div>
            `).join('');
        });

        function handleBuyNow(i) {
            if(!isUserIn) {
                openLogin();
            } else {
                document.getElementById('addrModal').style.display = 'flex';
            }
        }

        function openMenu() { document.getElementById('sidebar').style.width = "280px"; document.getElementById('overlay').style.display = "block"; }
        function closeMenu() { document.getElementById('sidebar').style.width = "0"; document.getElementById('overlay').style.display = "none"; }
        function openLogin() { document.getElementById('loginModal').style.display = "flex"; closeMenu(); }
        function closeModal(id) { document.getElementById(id).style.display = "none"; }

        function doLogin() {
            const p = document.getElementById('phone').value;
            if(p.length >= 10) {
                isUserIn = true;
                closeModal('loginModal');
                alert("Logged in successfully! You can now place your order.");
            } else {
                alert("Please enter a valid 10-digit number.");
            }
        }

        function openAI() { alert("KALA Assistant: How can I help you?"); closeMenu(); }
        function openPrivacy() { alert("Policy: 7 Days Return, 24h Refund."); closeMenu(); }
        function openOrders() { if(!isUserIn) openLogin(); else alert("Loading Orders..."); closeMenu(); }
    </script>
</body>
</html>
