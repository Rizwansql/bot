<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingo Live Signal - MOD BY SQL</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #floatingPanel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            background: linear-gradient(#111, #000);
            border: 3px solid #00ff00;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            color: #fff;
            z-index: 9999;
            text-align: center;
        }
        .header { font-size: 16px; color: #ff0000; font-weight: bold; text-shadow: 0 0 10px #ff0000; }
        .mod { font-size: 12px; color: #00ffea; margin-bottom: 10px; }
        .timer { font-size: 40px; color: #ffd700; font-weight: bold; }
        .predict { font-size: 50px; font-weight: 900; min-height: 70px; margin: 15px 0; }
        .history { font-size: 14px; color: #aaa; margin: 10px 0; max-height: 80px; overflow-y: auto; }
        .btn-group { display: flex; justify-content: center; gap: 10px; }
        .btn { padding: 12px 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-big { background: #00ff00; color: #000; }
        .btn-small { background: #ff3131; color: #fff; }
        .close-btn { position: absolute; top: 5px; right: 10px; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="floatingPanel">
    <button class="close-btn" onclick="document.getElementById('floatingPanel').style.display='none'">×</button>
    <div class="header">WINGO LIVE SIGNAL PRO</div>
    <div class="mod">MOD BY SQL</div>
    
    <div class="timer" id="timer">60s</div>
    
    <div class="predict" id="predict">WAIT</div>
    
    <div class="history" id="history">History: None</div>
    
    <div style="font-size:12px;margin:10px 0;">Add Latest Result:</div>
    <div class="btn-group">
        <button class="btn btn-big" onclick="addResult('BIG')">BIG</button>
        <button class="btn btn-small" onclick="addResult('SMALL')">SMALL</button>
    </div>
</div>

<script>
    let history = []; // Latest on right

    function addResult(res) {
        history.push(res);
        if (history.length > 20) history.shift();
        document.getElementById('history').innerText = "History: " + history.join(" → ");
    }

    function getPrediction() {
        if (history.length < 4) return {text: "NEED 4+ RESULTS", color: "orange"};

        let last4 = history.slice(-4).join("");
        let last3 = history.slice(-3).join("");
        let last2 = history.slice(-2).join("");

        // Enhanced Patterns (15+ rules)
        if (last4.includes("BIGBIGBIGBIG")) return {text: "SMALL", color: "#ff3131"};
        if (last4.includes("SMALLSMALLSMALLSMALL")) return {text: "BIG", color: "#00ff00"};
        if (last3 === "BIGBIGBIG" || last3 === "SMALLSMALLSMALL") return {text: last3.includes("BIG") ? "SMALL" : "BIG", color: last3.includes("BIG") ? "#ff3131" : "#00ff00"};
        if (last2 === "BIGBIG" || last2 === "SMALLSMALL") return {text: last2.includes("BIG") ? "SMALL" : "BIG", color: last2.includes("BIG") ? "#ff3131" : "#00ff00"};
        if (last4 === "BIGSMALLBIGSMALL" || last4 === "SMALLBIGSMALLBIG") return {text: history[history.length-1] === "BIG" ? "SMALL" : "BIG", color: history[history.length-1] === "BIG" ? "#ff3131" : "#00ff00"};

        // More patterns
        let bigCount = history.slice(-6).filter(x => x === "BIG").length;
        let smallCount = 6 - bigCount;
        if (bigCount >= 5) return {text: "SMALL", color: "#ff3131"};
        if (smallCount >= 5) return {text: "BIG", color: "#00ff00"};

        // Intelligent fallback (not pure random)
        let recentTrend = history.slice(-3);
        if (recentTrend[0] === recentTrend[1] && recentTrend[1] === recentTrend[2]) {
            return {text: recentTrend[0] === "BIG" ? "SMALL" : "BIG", color: recentTrend[0] === "BIG" ? "#ff3131" : "#00ff00"};
        }

        // 60% chance to follow last trend
        return Math.random() < 0.6 ? 
            {text: history[history.length-1], color: history[history.length-1] === "BIG" ? "#00ff00" : "#ff3131"} :
            {text: history[history.length-1] === "BIG" ? "SMALL" : "BIG", color: history[history.length-1] === "BIG" ? "#ff3131" : "#00ff00"};
    }

    function update() {
        let now = new Date();
        let sec = now.getSeconds();
        let remain = 60 - sec;
        document.getElementById('timer').innerText = remain + "s";

        let predBox = document.getElementById('predict');
        if (remain <= 20 && remain > 5) {
            let pred = getPrediction();
            predBox.innerText = pred.text;
            predBox.style.color = pred.color;
        } else if (remain <= 5) {
            predBox.innerText = "RESULT...";
            predBox.style.color = "cyan";
        } else {
            predBox.innerText = "ANALYZING...";
            predBox.style.color = "yellow";
        }
    }

    setInterval(update, 1000);
    update();
</script>

</body>
</html>
